# Quickstart: Bridge CLI with blackducksca:
#     https://blackduck-dev.zoominsoftware.io/bundle/bridge/page/documentation/c_using-bridge-with-black-duck.html
name: Black Duck Bridge CLI Scan
on:
  push:
    branches:
      - main
      - master
      - develop
      - stage
      - release
  pull_request:
    branches:
      - main
      - master
      - develop
      - stage
      - release
  workflow_dispatch: {}
# GitHub token permissions for post-scan actions. Required for built-in GITHUB_TOKEN; if using a PAT with equivalent scopes, permissions block can be commented out.
permissions:
  contents: write               # Required to push changes or create fix branches
  pull-requests: write          # Required to add comments or create fix pull requests
  security-events: write        # Required to upload SARIF results to GitHub Security
jobs:
  blackducksca:
    runs-on: self-hosted
    env:
      BRIDGE_BLACKDUCKSCA_URL: ${{ vars.BLACKDUCKSCA_URL }}
      BRIDGE_BLACKDUCKSCA_TOKEN: ${{ secrets.BLACKDUCKSCA_TOKEN }}
      BRIDGE_GITHUB_REPOSITORY_OWNER_NAME: ${{ github.repository_owner }}
      BRIDGE_GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
      BRIDGE_GITHUB_REPOSITORY_BRANCH_NAME: ${{ github.ref_name }}
      BRIDGE_BLACKDUCKSCA_FIXPR_ENABLED: "true"
      BRIDGE_BLACKDUCKSCA_REPORTS_SARIF_CREATE: "true"
      BRIDGE_BLACKDUCKSCA_REPORTS_SARIF_UPLOAD: "true"
      BRIDGE_GITHUB_USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Download & Setup Bridge CLI
        shell: bash
        run: |
          BRIDGE_CLI_DOWNLOAD_URL="https://repo.blackduck.com/bds-integrations-release/com/blackduck/integration/bridge/binaries/bridge-cli-bundle/latest"
      
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Convert Windows path to Unix style for bash
            RUNNER_TEMP_UNIX=$(echo "$RUNNER_TEMP" | sed 's|\\|/|g; s|^\([A-Za-z]\):|/\L\1|')
            
            # Download and unzip using curl and unzip (available in GitHub Windows runners)
            curl -sSL -o bridge.zip "$BRIDGE_CLI_DOWNLOAD_URL/bridge-cli-bundle-win64.zip"
            unzip -qo bridge.zip -d "$RUNNER_TEMP_UNIX"
            
            # Find the executable
            BRIDGE_CLI_PATH=$(find "$RUNNER_TEMP_UNIX" -type f -name bridge-cli.exe | head -n1)
            echo "BRIDGE_CLI_INSTALL_DIR=$BRIDGE_CLI_PATH" >> "$GITHUB_ENV"
      
          else
            # Determine OS for macOS/Linux
            OS=$([[ "$RUNNER_OS" == "macOS" ]] && ([[ $(uname -m) =~ arm ]] && echo macos_arm || echo macosx) || ([[ $(uname -m) =~ arm ]] && echo linux_arm || echo linux64))
            
            # Download and unzip
            curl -sSL -o bridge.zip "$BRIDGE_CLI_DOWNLOAD_URL/bridge-cli-bundle-$OS.zip"
            unzip -qo bridge.zip -d "$RUNNER_TEMP"
            
            # Find the executable
            BRIDGE_CLI_PATH=$(find "$RUNNER_TEMP" -type f -name bridge-cli | head -n1)
            echo "BRIDGE_CLI_INSTALL_DIR=$BRIDGE_CLI_PATH" >> "$GITHUB_ENV"
          fi
      - name: Blackducksca Full Scan
        if: ${{ github.event_name != 'pull_request' }}
        run: ${{ env.BRIDGE_CLI_INSTALL_DIR }} --stage blackducksca --diagnostics
      - name: Blackducksca PR Scan
        if: ${{ github.event_name == 'pull_request' }}
        run: |-
          ${{ env.BRIDGE_CLI_INSTALL_DIR }} --stage blackducksca  --diagnostics  \
             blackducksca.automation.prcomment=true  \
             github.repository.pull.number=${{ github.event.number }}
